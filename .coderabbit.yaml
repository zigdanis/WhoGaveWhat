# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

reviews:
  review_status: false
  auto_review:
    enabled: true
    auto_incremental_review: false
    drafts: false

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - files: ".macroscope/correctness/correctness.md"
        applyTo: "**/*"
