name: Checks

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scripts:
    name: Scripts and secret patterns
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install ffmpeg for evidence publisher tests
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
      - run: scripts/check-secrets.sh
      - run: python3 -m unittest discover -s scripts/tests -v
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Release coordinator and archive validation tests
        run: |
          for test in fastlane/tests/test_*.rb; do
            bundle exec ruby "$test"
          done

  icon-worker:
    name: Icon Worker tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: icon-worker
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: icon-worker/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
      - name: Bundle without deploying
        run: npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/icon-worker-bundle"

  quality:
    name: Swift format and lint
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install SwiftLint
        run: brew install swiftlint
      - run: scripts/check-formatting.sh
      - run: scripts/lint-swift.sh

