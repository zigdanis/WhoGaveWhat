name: Tests

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret Patterns
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tracked files
        run: scripts/check-secrets.sh

  test:
    name: Unit tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable   # Xcode 26+ — required for the iOS 26 SDK

      - name: Show versions
        run: |
          xcodebuild -version
          swift --version

      - name: Build & Test
        run: |
          set -o pipefail
          FORMATTER=cat
          command -v xcbeautify >/dev/null 2>&1 && FORMATTER=xcbeautify
          # iPhone 17 is the default device on the Xcode 26 runner image;
          # OS=latest pins the newest installed runtime so an ambiguous match
          # (several iOS versions of the same device) can't fail resolution.
          # Letting xcodebuild resolve name+OS guarantees an *eligible*
          # destination — unlike a raw UDID from `simctl list ... available`.
          xcodebuild test \
            -project WhoGaveWhat.xcodeproj \
            -scheme WhoGaveWhat \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | "$FORMATTER"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults.xcresult
          if-no-files-found: ignore
