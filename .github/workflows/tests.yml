name: Tests

on:
  push:
    branches: [master]
    paths-ignore:
      - '*.md'
      - '*.html'
      - '.agents/**'
      - '.claude/**'
      - 'docs/**'
      - 'icon-worker/**'
      - '.github/workflows/icon-worker.yml'
  pull_request:
    paths-ignore:
      - '*.md'
      - '*.html'
      - '.agents/**'
      - '.claude/**'
      - 'docs/**'
      - 'icon-worker/**'
      - '.github/workflows/icon-worker.yml'
  workflow_dispatch:
    inputs:
      spotlight_diagnostics:
        description: Run optional OS Spotlight diagnostic (app-owned acceptance still runs)
        type: boolean
        default: false
      video_test:
        description: Optional UI test to record as a short clip after the suite passes (WhoGaveWhatUITests/Class/testMethod)
        type: string
        default: ''

permissions:
  contents: read

# Superseded PR runs are cancelled. Master and manual runs get unique groups, so
# every master commit keeps its run for deployment.
concurrency:
  group: tests-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.name }}
    # GitHub's Xcode 27 image (macOS 27); see actions/runner-images#14404.
    runs-on: xcode-27
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        include:
          # The iOS 27.1 Simulator runtime supports only iPhone Duo, which boots folded
          # (outer display). Regular iPhones run the preinstalled iOS 27.0 runtime.
          - name: Unit tests and app smoke
            device: iPhone Duo
            runtime: iOS 27.1
            artifact: ui-app-smoke
          - name: Unit tests and app smoke (iPhone 18 Pro)
            device: iPhone 18 Pro
            runtime: iOS 27.0
            artifact: ui-iphone-smoke
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      XCODE_VERSION: '27.1'
      SIMULATOR_RUNTIME: ${{ matrix.runtime }}
      SIMULATOR_DEVICE: ${{ matrix.device }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Show tool versions
        run: |
          swift --version
          xcodebuild -version
          xcodebuild -showsdks
          xcrun simctl help
          xcrun simctl help create
          xcrun simctl help delete
          xcrun xcresulttool version
      - name: Install the iOS Simulator runtime for the selected Xcode
        run: scripts/install-simulator-runtime.sh "$SIMULATOR_RUNTIME" "$SIMULATOR_DEVICE"
      - name: Test app smoke and record any requested clip
        env:
          VIDEO_TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.video_test || '' }}
        run: python3 scripts/run-app-smoke.py "$RUNNER_TEMP/ui-app-smoke" --verify-app-names --runtime "$SIMULATOR_RUNTIME" --device "$SIMULATOR_DEVICE" --fresh-ci-simulator --check-localizations ${VIDEO_TEST:+--video-test "$VIDEO_TEST"}
      - name: Render evidence report
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/ui-app-smoke/metadata.json"; then
            python3 scripts/ui-evidence-report.py "$RUNNER_TEMP/ui-app-smoke"
          fi
      - name: Upload app evidence and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ui-app-smoke
          if-no-files-found: warn
          retention-days: 14

  spotlight-diagnostics:
    name: Spotlight diagnostics (non-acceptance)
    continue-on-error: true
    if: github.event_name == 'workflow_dispatch' && inputs.spotlight_diagnostics
    runs-on: xcode-27
    timeout-minutes: 55
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      XCODE_VERSION: '27.1'
      SIMULATOR_RUNTIME: iOS 27.1
      SIMULATOR_DEVICE: iPhone Duo
      HEAD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Show native tool versions
        run: |
          xcodebuild -version
          xcrun simctl help
          xcrun simctl help create
          xcrun simctl help delete
          xcrun xcresulttool version
      - name: Install the iOS Simulator runtime for the selected Xcode
        run: scripts/install-simulator-runtime.sh "$SIMULATOR_RUNTIME" "$SIMULATOR_DEVICE"
      - name: Run focused Spotlight diagnostic
        run: python3 scripts/run-app-smoke.py "$RUNNER_TEMP/spotlight-diagnostics" --verify-app-names --discovery-only --runtime "$SIMULATOR_RUNTIME" --device "$SIMULATOR_DEVICE" --fresh-ci-simulator
      - name: Render diagnostic report
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/spotlight-diagnostics/metadata.json"; then
            python3 scripts/ui-evidence-report.py "$RUNNER_TEMP/spotlight-diagnostics"
          fi
      - name: Upload non-acceptance Spotlight diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spotlight-diagnostics-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/spotlight-diagnostics
          if-no-files-found: warn
          retention-days: 14
