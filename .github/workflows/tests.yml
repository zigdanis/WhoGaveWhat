name: Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      spotlight_diagnostics:
        description: Run an additional focused Spotlight diagnostic (full tests still run)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scripts:
    name: Scripts and secret patterns
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg for evidence publisher tests
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
      - run: scripts/check-secrets.sh
      - run: python3 -m unittest discover -s scripts/tests -v
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Release coordinator and archive validation tests
        run: |
          for test in fastlane/tests/test_*.rb; do
            bundle exec ruby "$test"
          done

  quality:
    name: Swift format and lint
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Install SwiftLint
        run: brew install swiftlint
      - run: scripts/check-formatting.sh
      - run: scripts/lint-swift.sh

  test:
    name: Unit tests and app smoke
    runs-on: macos-26
    timeout-minutes: 55
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      XCODE_VERSION: '26.6'
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Show tool versions
        run: |
          swift --version
          xcodebuild -version
          xcrun simctl help
          xcrun xcresulttool version
      - name: Test and record app smoke
        run: python3 scripts/run-app-smoke.py "$RUNNER_TEMP/ui-app-smoke" --verify-app-names --runtime 'iOS 26.4'
      - name: Render evidence report
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/ui-app-smoke/metadata.json"; then
            python3 scripts/ui-evidence-report.py "$RUNNER_TEMP/ui-app-smoke"
          fi
      - name: Upload app evidence and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-app-smoke-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ui-app-smoke
          if-no-files-found: warn
          retention-days: 14

  spotlight-diagnostics:
    name: Spotlight diagnostics (non-acceptance)
    if: github.event_name == 'workflow_dispatch' && inputs.spotlight_diagnostics
    runs-on: macos-26
    timeout-minutes: 55
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      XCODE_VERSION: '26.6'
      HEAD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Show native tool versions
        run: |
          xcodebuild -version
          xcrun simctl help
          xcrun xcresulttool version
      - name: Run focused Spotlight diagnostic
        run: python3 scripts/run-app-smoke.py "$RUNNER_TEMP/spotlight-diagnostics" --verify-app-names --discovery-only --runtime 'iOS 26.4'
      - name: Render diagnostic report
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/spotlight-diagnostics/metadata.json"; then
            python3 scripts/ui-evidence-report.py "$RUNNER_TEMP/spotlight-diagnostics"
          fi
      - name: Upload non-acceptance Spotlight diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spotlight-diagnostics-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/spotlight-diagnostics
          if-no-files-found: warn
          retention-days: 14
