name: Tests

on:
  push:
    branches: [master]
    paths-ignore:
      - '*.md'
      - '*.html'
      - '.agents/**'
      - '.claude/**'
      - 'docs/**'
      - 'icon-worker/**'
      - '.github/workflows/icon-worker.yml'
  pull_request:
    paths-ignore:
      - '*.md'
      - '*.html'
      - '.agents/**'
      - '.claude/**'
      - 'docs/**'
      - 'icon-worker/**'
      - '.github/workflows/icon-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

# Superseded PR runs are cancelled. Master and manual runs get unique groups, so
# every master commit keeps its run for deployment.
concurrency:
  group: tests-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests
    # GitHub's Xcode 27 image (macOS 27); see actions/runner-images#14404.
    runs-on: xcode-27
    timeout-minutes: 50
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      XCODE_VERSION: '27.1'
      # The iOS 27.1 Simulator runtime supports only iPhone Duo; the app's UI tests are not run here,
      # so the model only has to exist on the runtime the app is built against.
      SIMULATOR_RUNTIME: iOS 27.1
      SIMULATOR_DEVICE: iPhone Duo
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Show tool versions
        run: |
          swift --version
          xcodebuild -version
          xcodebuild -showsdks
          xcrun simctl help
      - name: Install the iOS Simulator runtime for the selected Xcode
        run: scripts/install-simulator-runtime.sh "$SIMULATOR_RUNTIME" "$SIMULATOR_DEVICE"
      - name: Run unit tests and check the built app's names and String Catalog
        run: python3 scripts/run-unit-tests.py "$RUNNER_TEMP/unit-tests" --runtime "$SIMULATOR_RUNTIME" --device "$SIMULATOR_DEVICE" --fresh-ci-simulator
      - name: Upload test logs and result bundle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-tests-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/unit-tests
          if-no-files-found: warn
          retention-days: 14
