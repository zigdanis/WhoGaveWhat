name: Tests

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable   # Xcode 26+ — required for the iOS 26 SDK

      - name: Show versions
        run: |
          xcodebuild -version
          swift --version

      - name: Pick an iOS Simulator
        id: sim
        run: |
          # Ask xcodebuild itself which simulators are *eligible* for the active
          # toolchain. `simctl list ... available` is broader than this — it
          # surfaces shared CoreSimulator devices the selected Xcode can't run
          # tests on, which xcodebuild then rejects ("Unable to find a
          # destination matching id=..."). Read only the "Available destinations"
          # block and take the first arm64 iOS Simulator.
          DEST_ID=$(xcodebuild -project WhoGaveWhat.xcodeproj -scheme WhoGaveWhat \
                      -showdestinations 2>/dev/null \
            | awk '/Ineligible destinations/{exit} {print}' \
            | grep 'platform:iOS Simulator' | grep 'name:iPhone' \
            | grep -oE 'id:[0-9A-Fa-f-]{36}' | head -1 | cut -d: -f2)
          test -n "$DEST_ID" || { echo "No eligible iOS Simulator destination"; exit 1; }
          echo "Using destination $DEST_ID"
          echo "udid=$DEST_ID" >> "$GITHUB_OUTPUT"

      - name: Build & Test
        env:
          SIM_UDID: ${{ steps.sim.outputs.udid }}
        run: |
          set -o pipefail
          FORMATTER=cat
          command -v xcbeautify >/dev/null 2>&1 && FORMATTER=xcbeautify
          xcodebuild test \
            -project WhoGaveWhat.xcodeproj \
            -scheme WhoGaveWhat \
            -destination "id=$SIM_UDID" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | "$FORMATTER"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults.xcresult
          if-no-files-found: ignore
