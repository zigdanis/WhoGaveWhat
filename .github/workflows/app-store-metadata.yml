name: App Store metadata
run-name: App Store metadata ${{ inputs.app_version }}${{ inputs.screenshots_release && format(' with screenshots {0}', inputs.screenshots_release) || '' }}

# Uploads the listing text from fastlane/metadata, and when given the screenshots captured on MacPro and published
# as a draft release by scripts/publish-store-screenshots.sh, to the editable App Store version. It never uploads a
# build and never submits for review. Screenshots are never captured in CI.
on:
  workflow_dispatch:
    inputs:
      app_version:
        description: App Store version to create or update, for example 1.0
        type: string
        required: true
      screenshots_release:
        description: Optional draft release tag (store-screenshots/YYYYMMDD-HHMMSS) from scripts/publish-store-screenshots.sh; its screenshots replace the version's screenshots
        type: string

permissions:
  contents: read

# Shared with TestFlight so the two never touch App Store Connect at the same time.
concurrency:
  group: whogavewhat-testflight
  cancel-in-progress: false

jobs:
  metadata:
    if: github.repository == 'zigdanis/WhoGaveWhat' && github.ref == 'refs/heads/master' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: testflight
    permissions:
      contents: write # Only to read the unpublished draft release that holds the screenshots; never publishes or pushes.
    env:
      STORE_VERSION: ${{ inputs.app_version }}
      SCREENSHOTS_RELEASE: ${{ inputs.screenshots_release }}
      FASTLANE_SKIP_UPDATE_CHECK: 'true'
      FASTLANE_HIDE_CHANGELOG: 'true'
      FASTLANE_SKIP_DOCS: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Validate inputs and prepare a private directory
        run: |
          [[ "$STORE_VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || { echo 'app_version must look like 1.0 or 1.0.1'; exit 1; }
          [[ -z "$SCREENSHOTS_RELEASE" || "$SCREENSHOTS_RELEASE" =~ ^store-screenshots/[0-9]{8}-[0-9]{6}$ ]] \
            || { echo 'screenshots_release must look like store-screenshots/20261108-174500'; exit 1; }
          DIRECTORY=$(mktemp -d "$RUNNER_TEMP/whogavewhat-store.XXXXXX")
          chmod 700 "$DIRECTORY"
          echo "STORE_TEMP=$DIRECTORY" >> "$GITHUB_ENV"
      - name: Download the reviewed screenshots
        if: inputs.screenshots_release != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Only an unpublished draft of this repository, which only people with push access can create, is accepted.
          RELEASES=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate \
            --jq "[.[] | select(.draft and .tag_name == \"$SCREENSHOTS_RELEASE\")]" | jq -s add)
          [ "$(jq length <<< "$RELEASES")" = 1 ] || { echo "No single draft release $SCREENSHOTS_RELEASE"; exit 1; }
          ASSET=$(jq -r '.[0].assets[] | select(.name == "store-screenshots.tar.gz") | .id' <<< "$RELEASES")
          [ -n "$ASSET" ] || { echo "Draft $SCREENSHOTS_RELEASE has no store-screenshots.tar.gz"; exit 1; }
          echo "Screenshots from $(jq -r '.[0].target_commitish' <<< "$RELEASES")"
          gh api -H 'Accept: application/octet-stream' "repos/$GITHUB_REPOSITORY/releases/assets/$ASSET" \
            > "$STORE_TEMP/store-screenshots.tar.gz"
          mkdir "$STORE_TEMP/downloaded"
          python3 -c 'import sys, tarfile; tarfile.open(sys.argv[1]).extractall(sys.argv[2], filter="data")' \
            "$STORE_TEMP/store-screenshots.tar.gz" "$STORE_TEMP/downloaded"
          # Every set from one commit: deliver replaces each language's sets, so a missing set would be deleted.
          python3 scripts/store-screenshots.py "$STORE_TEMP/downloaded" --check
          echo "STORE_SCREENSHOTS_DIR=$STORE_TEMP/downloaded/screenshots" >> "$GITHUB_ENV"
      - name: Retrieve the App Store Connect key
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          value = os.environ.get('ASC_PRIVATE_KEY', '')
          if not value.strip():
              raise SystemExit('Missing environment secret: ASC_PRIVATE_KEY')
          path = Path(os.environ['STORE_TEMP']) / 'AuthKey.p8'
          path.write_text(value.rstrip('\n') + '\n')
          path.chmod(0o600)
          PY
          echo "ASC_KEY_PATH=$STORE_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
      - name: Upload the listing
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          BETA_REVIEW_INFO: ${{ secrets.BETA_REVIEW_INFO }}
        run: bundle exec fastlane ios store_metadata
      - name: Remove keys and downloaded files
        if: always()
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          python3 - <<'PY'
          import os, shutil
          from pathlib import Path
          key_id = os.environ.get('ASC_KEY_ID', '')
          if key_id and key_id.isalnum():
              (Path.home() / '.appstoreconnect/private_keys' / ('AuthKey_' + key_id + '.p8')).unlink(missing_ok=True)
          path = os.environ.get('STORE_TEMP')
          if path:
              shutil.rmtree(path, ignore_errors=True)
          PY
